career-profile:
    title: Career Profile
    summary: |
      Software Engineering Manager with 20+ years of experience, currently leading the software department of a simulation division. 
      I pair hands-on engineering with team leadership: I structure software factories, set up CI/CD and quality processes, 
      and stay close to system architecture to keep solutions robust, scalable and maintainable.

      My background spans microservice architectures, large-scale data processing (web crawling at billions of pages per day),
      cloud platforms (GCP, OpenShift) and full-stack development in Java and PHP. Along the way I have filed several patents, 
      contributed to the ONAP open-source project for 5G network lifecycle management, and mentored apprentices and engineers.

education:
    - degree: MSc in Computer Science
      university: University of Rennes
      time: 1997 - 2000
    - degree: Higher Education Diploma in Electronics
      university: University of Angers
      time: 1995 - 1997
experiences:
    - role: Software Engineering Manager
      time: 2025 - now
      company: Exail Robotics, Lannion
      details: |
        I lead the software department at Exail Robotics in Lannion, managing a multidisciplinary team responsible for developing advanced terrestrial and aerial training simulators. Our simulators cover both civil (e.g., firefighter training) and military use cases, with multiple levels of fidelity up to Full-Flight Simulator (FFS) standards. I structured the software factory for the simulation division, improving our development workflows, CI/CD practices, and quality processes. I support the teams throughout the full lifecycle, from early design to delivery, while staying hands-on with key technical topics and system architecture to ensure robust, scalable, and maintainable solutions.

    - role: Software Engineer
      time: 2022 - 2025
      company: Babbar.tech, Full remote
      details: |
        At Babbar.tech, I contributed to the development of our powerful web crawling tool in Java, which processes over 3 billion pages per day, enabling large-scale web data collection. I also designed an image generation service based on the Stable Diffusion framework, allowing for high-quality visuals for various applications. Additionally, I led the complete overhaul of the YourText.guru service, developed in PHP Laravel, integrating numerous new SEO features to enhance its optimization capabilities. These experiences strengthened my skills in large-scale data processing, visual content generation, and the development of high-performance, flexible solutions.

        Technologies:
          - Java, Spring boot
          - PHP, Laravel
          - PostgreSQL
          - GCP
          - Stable Diffusion, AI
    - role: Software Architect
      time: 2019 - 2022
      company: Orange, Lannion
      details: |
        R&D department of France's leading telecom operator.
          - Designed and built microservice architectures for enterprise services in a highly asynchronous environment
          - Managed CI/CD and build chains
          - Adapted code for PaaS services
          - Contributed to the ONAP open-source project, which enables end-to-end lifecycle management of 5G networks
          - Coached and supervised apprentices and trainees
          - Filed a patent on blockchain technology

        Technologies:
          - Java, Golang
          - MariaDB, Redis, RabbitMQ
          - Docker, Openshift, Cloud Foundry
          - Gitlab CI
    - role: Software Architect
      time: 2016 - 2019
      company: Apizee, Lannion
      details: |
        Apizee provides a plugin-free WebRTC solution for web video calls and one-click web conferencing (Izeeconf).
          - Led the migration of the PHP stack from Symfony 2 to Laravel 5
          - Moved hosting to a private cloud based on VMware, applying security best practices (VLAN, VPN, firewall…)
          - As Scrum Master, worked with the Product Manager to organise all sprint tasks
          - Streamlined deployment of the Apizee platform: orchestrated Docker images with Rancher, cutting full deployments to under 10 minutes on client servers
        Technologies:
          - PHP, Laravel
          - PostgreSQL, Redis
          - Docker, Rancher
    - role: CTO
      time: 2013 - 2016
      company: Sushee, Lannion
      details: |
        Co-founded Sushee, a video game studio. We started with small HTML5 web games for brands such as Hollywood and Oasis, then grew to a team of 7 to build our own game, Goetia. Square Enix's indie division backed the project as publisher; Goetia is available on Steam and GOG.com.
          - Managed the development team
          - Built the Steam API integration
          - Developed and deployed the backend for all our games

        Technologies:
          - PHP, C#
          - Mysql
          - OVH, GAE
    - role: CEO
      time: 2012 - 2016
      company: Apptom, Lannion
      details: |
        Supported companies in migrating their infrastructure to public cloud solutions like Amazon Web Services or Google.
          - Audit to optimise response time for a website
          - Developed a scalable chat service
          - Created a service on the first version of PHP Google App Engine to manage a “Question / Answer” web service

        Technologies:
          - PHP, Java
          - Mysql
          - AWS EC2, Beanstalk, RDS
    - role: Software Developer
      time: 2003 - 2012
      company: Orange, Lannion
      details: |
        R&D department of France's leading telecom operator.
          - Developed a JEE application managing alerts for emergency services
          - Built an MDA (Model Driven Architecture) solution based on UML models
          - Filed two patents (FR2890204A1, EP1630761A1)
          - Designed a machine-to-machine middleware, owning the architecture and developing all asynchronous message handling and connectors to other Orange services
          - Introduced Scrum methodologies to the team
          - Developed and shipped the first version of “Orange and Me” for Switzerland, an app that informs customers about their usage

        Technologies:
          - Java, Struts, EJB, Objective-C
          - Mysql
          - MDA

